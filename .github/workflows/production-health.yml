name: production-health

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: jawla-production-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://jawla-production.up.railway.app' }}
      INCIDENT_TITLE: "[P1] Jawla production health check failing"
    steps:
      - id: probe
        name: Verify application, database, and cache health
        shell: bash
        run: |
          set -euo pipefail
          health_url="${PRODUCTION_URL%/}/health"

          for attempt in 1 2 3; do
            if response="$(curl --fail --silent --show-error \
              --max-time 10 "$health_url")" &&
              jq -e '.status == "ok" and .db == "ok" and .cache == "ok"' \
                <<<"$response" >/dev/null; then
              exit 0
            fi

            if [[ "$attempt" != "3" ]]; then
              sleep 10
            fi
          done

          echo "Production health failed after three attempts." >&2
          exit 1

      - name: Open or update the production incident
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          issue_number="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "$INCIDENT_TITLE in:title" \
            --json number \
            --jq '.[0].number // empty')"

          body="Automated production health monitoring failed after three attempts.

          Health URL: ${PRODUCTION_URL%/}/health
          Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Treat this as a P1 until application, database, and cache health are verified."

          if [[ -n "$issue_number" ]]; then
            gh issue comment "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --body "$body"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$INCIDENT_TITLE" \
              --body "$body"
          fi

      - name: Close recovered production incident
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          issue_number="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "$INCIDENT_TITLE in:title" \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -n "$issue_number" ]]; then
            gh issue close "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --comment "Automated health checks recovered. Review runtime logs before closing the incident internally."
          fi
