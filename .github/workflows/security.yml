name: security

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_ENV: testing

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan Git history and working tree for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: "8.3"
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: composer install --no-scripts --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env
      - run: mkdir -p storage/framework/{cache,sessions,views} bootstrap/cache
      - run: php artisan key:generate --force
      - run: composer run post-autoload-dump
      - run: npm ci
      - run: composer audit
      - run: npm audit --audit-level=high

  # Passive warnings remain report-only (`-I`). Scanner/runtime failures block.
  # Runs on PRs (non-blocking) and on push to master (blocking).
  dast-zap:
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jawla_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: jawla_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo, pdo_pgsql, intl, gd, zip, bcmath
          coverage: none
      - run: composer install --no-scripts --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env
      - run: mkdir -p storage/framework/{cache,sessions,views} bootstrap/cache
      - run: php artisan key:generate --force
      - run: composer run post-autoload-dump
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
      - name: Serve app
        run: PHP_CLI_SERVER_WORKERS=4 php artisan serve --host=127.0.0.1 --port=8080 &
      - name: Wait for readiness
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/health | jq -e '.status == "ok"' && exit 0
            sleep 2
          done
          echo "app did not become ready"
          exit 1
      - name: OWASP ZAP baseline scan
        run: |
          docker run --network=host -v "$(pwd):/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable@sha256:8d387b1a63e3425beef4846e39719f5af2a787753af2d8b6558c6257d7a577a2 zap-baseline.py \
            -t http://127.0.0.1:8080 -I -m 3 \
            -r zap-report.html -w zap-report.md
      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zap-report
          path: |
            zap-report.html
            zap-report.md
          if-no-files-found: ignore
