name: security

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ZAP baseline scan (staging)
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'https://staging.jawla.example'
          fail_action: true
          allow_issue_writing: false
