name: security

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # NOTE: CodeQL was removed — it does not support PHP (the analysis fails with
  # "Did not recognize the following languages: php"), so it could never run for
  # this Laravel app and permanently blocked the check suite (and every deploy).
  # PHP static analysis belongs in a PHP-native tool (e.g. Larastan/PHPStan);
  # dependency vulnerability scanning is covered by the job below.

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci
      - run: composer audit
      - run: npm audit --audit-level=high

  zap-baseline:
    # Only runs when a staging target is configured (repo/org variable).
    # Skipped — not failed — when unset, so the check suite stays green.
    if: ${{ vars.JAWLA_STAGING_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZAP baseline scan (staging)
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ vars.JAWLA_STAGING_URL }}
          fail_action: true
          allow_issue_writing: false
