name: Lighthouse CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "0 2 * * 0"

jobs:
  lighthouse:
    name: Run Lighthouse
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: /workdir
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Install Lighthouse CLI
        run: npm install -g @lighthouse-ci/cli

      - name: Run Lighthouse
        env:
          CI: true
          BASE_URL: http://127.0.0.1:8000
        run: |
          npx lighthouse http://127.0.0.1:8000 --config-path=.github/lighthouse-config.json --output=json --output json 2>&1 | jq '.'

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report-${{ github.sha }}
          path: lighthouse-report.json

  # Optional: Enforce performance budgets using assert
  enforce-budgets:
    name: Enforce Performance Budgets
    needs: lighthouse
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: /workdir
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Install Lighthouse budgets
        run: npm ci --include-dev

      - name: Run budget assertions
        run: npx lhci autorun --config=.github/lighthouse-config.json

      - name: Fail on budget breach
        run: |
          if [ "$?" -ne 0 ]; then
            echo "❌ Performance budgets not met — failing build"
            exit 1
          fi
          echo "✅ All performance budgets satisfied"
