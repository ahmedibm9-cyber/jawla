name: e2e

# Real-browser (Playwright/Chromium) end-to-end tests via pest-plugin-browser.
# Advisory only: the whole job is continue-on-error, so an E2E flake is VISIBLE
# in the Actions tab but never fails the check suite Railway gates on — it is
# deliberately not a deploy blocker. Comprehensive admin coverage also runs in
# TestSprite against the deployed app.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jawla_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo, pdo_pgsql, intl, gd, zip, bcmath
          coverage: none
      - name: Install PHP deps
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install JS deps
        run: npm ci
      - name: Install Playwright + Chromium
        run: npm install --no-save playwright@latest && npx playwright install --with-deps chromium
      - name: Copy env
        run: cp .env.example .env && php artisan key:generate
      - name: Build production assets
        run: npm run build
      - name: Migrate test database
        run: php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: jawla_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
      - name: Pest Browser (E2E)
        run: vendor/bin/pest --testsuite=Browser
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: jawla_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
