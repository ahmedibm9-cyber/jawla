name: rollback-production

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: Previously successful Railway deployment ID
        required: true
        type: string
      confirmation:
        description: Type ROLLBACK_PRODUCTION
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: jawla-production-promotion
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      DEPLOYMENT_ID: ${{ inputs.deployment_id }}
      CONFIRMATION: ${{ inputs.confirmation }}
      RAILWAY_GRAPHQL_URL: https://backboard.railway.com/graphql/v2
    steps:
      - name: Validate explicit rollback confirmation
        run: |
          test "$CONFIRMATION" = "ROLLBACK_PRODUCTION"
          test -n "$DEPLOYMENT_ID"
          test -n "$RAILWAY_API_TOKEN"

      - name: Verify deployment can be rolled back
        run: |
          payload=$(jq -n \
            --arg query 'query deployment($id: String!) { deployment(id: $id) { id status canRollback } }' \
            --arg id "$DEPLOYMENT_ID" \
            '{query: $query, variables: {id: $id}}')
          response=$(curl -fsS "$RAILWAY_GRAPHQL_URL" \
            -H "Authorization: Bearer $RAILWAY_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload")
          echo "$response" | jq -e \
            '.errors == null and .data.deployment.canRollback == true'

      - id: rollback
        name: Roll back application deployment
        run: |
          payload=$(jq -n \
            --arg query 'mutation deploymentRollback($id: String!) { deploymentRollback(id: $id) { id } }' \
            --arg id "$DEPLOYMENT_ID" \
            '{query: $query, variables: {id: $id}}')
          response=$(curl -fsS "$RAILWAY_GRAPHQL_URL" \
            -H "Authorization: Bearer $RAILWAY_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload")
          rollback_id=$(echo "$response" | jq -er '.data.deploymentRollback.id')
          echo "rollback_id=$rollback_id" >> "$GITHUB_OUTPUT"

      - name: Wait for rollback deployment
        env:
          ROLLBACK_ID: ${{ steps.rollback.outputs.rollback_id }}
        run: |
          for i in $(seq 1 60); do
            payload=$(jq -n \
              --arg query 'query deployment($id: String!) { deployment(id: $id) { id status } }' \
              --arg id "$ROLLBACK_ID" \
              '{query: $query, variables: {id: $id}}')
            response=$(curl -fsS "$RAILWAY_GRAPHQL_URL" \
              -H "Authorization: Bearer $RAILWAY_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$payload")
            status=$(echo "$response" | jq -er '.data.deployment.status')
            case "$status" in
              SUCCESS)
                exit 0
                ;;
              FAILED|CRASHED|REMOVED|SKIPPED)
                echo "rollback entered terminal failure state: $status"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "rollback did not reach a terminal state in time"
          exit 1

      - name: Verify production readiness after rollback
        run: |
          test -n "$PRODUCTION_URL"
          curl -fsS "${PRODUCTION_URL%/}/health" |
            jq -e '.status == "ok" and .db == "ok" and .cache == "ok"'
