name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: testing
  PAO_DISABLE: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, json, bcmath, pgsql
          tools: composer:v2
          coverage: none
          composer: true
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: ./vendor/bin/pint --test

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, json, bcmath, pgsql, gd, intl, zip
          tools: composer:v2
          coverage: none
          composer: true
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate --force
      - name: PHPStan runtime-safety gate
        run: ./vendor/bin/phpstan analyse --level=3 --memory-limit=2G --no-progress

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, bcmath, pgsql, gd, intl, zip
          tools: composer:v2
          coverage: none
          composer: true
      - run: composer install --no-dev --no-scripts --no-interaction --no-progress --prefer-dist
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:offline
      - run: npm run build
      - run: npm run audit:pwa-assets

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the production image
        run: docker build --tag jawla:ci .
      - name: Verify required runtime extensions
        run: >-
          docker run --rm jawla:ci php -r
          'foreach (["bcmath", "gd", "intl", "mbstring", "pdo_pgsql", "redis", "zip", "Zend OPcache"] as $extension) {
          if (! extension_loaded($extension)) { fwrite(STDERR, "Missing PHP extension: {$extension}\n"); exit(1); } }'
      - name: Verify the production entrypoint
        run: docker run --rm jawla:ci sh -n /app/docker/start-container.sh
      - name: Verify build tooling is absent at runtime
        run: docker run --rm jawla:ci sh -c 'test ! -e /usr/local/bin/composer'

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none
          composer: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci
      - run: composer validate --strict --no-check-publish
      - run: composer audit
      - run: npm audit --audit-level=high --omit=dev

  lighthouse:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_DB: jawla_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: jawla_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, json, bcmath, pgsql, gd, intl, zip
          tools: composer:v2
          coverage: none
          composer: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci
      - run: npm run build
      - run: cp .env.example .env
      - run: php artisan key:generate --force
      - run: php artisan migrate --force
      - name: Start server and run Lighthouse
        run: |
          php artisan serve --host=127.0.0.1 --port=8765 &
          SERVER_PID=$!
          sleep 5
          npx lhci autorun --config=lighthouserc.json || exit_code=$?
          kill $SERVER_PID 2>/dev/null || true
          exit ${exit_code:-0}

  backup-verification:
    runs-on: ubuntu-latest
    name: Backup Verification
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify backup environment variables
        run: |
          missing=0
          reasons=()
          if [ -z "${BACKUP_STORAGE_URI:-}" ]; then
            missing=$((missing+1))
            reasons+=("BACKUP_STORAGE_URI is not set")
          fi
          if [ -z "${BACKUP_AGE_RECIPIENT:-}" ]; then
            missing=$((missing+1))
            reasons+=("BACKUP_AGE_RECIPIENT is not set")
          fi
          if [ -n "${RESTORE_EVIDENCE_FILE:-}" ] && [ ! -f "$RESTORE_EVIDENCE_FILE" ]; then
            missing=$((missing+1))
            reasons+=("RESTORE_EVIDENCE_FILE not found: $RESTORE_EVIDENCE_FILE")
          fi
          if [ $missing -gt 0 ]; then
            echo "backup-verification-failed=true" >> $GITHUB_OUTPUT
            echo "Missing backup configuration:" >&2
            for r in "${reasons[@]}"; do echo "  - $r" >&2; done
            exit 1
          fi
          echo "backup-verification-failed=false" >> $GITHUB_OUTPUT
          echo "All backup environment variables are configured"

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan Git history and working tree
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_DB: jawla_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: jawla_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, json, bcmath, pgsql, gd, intl, zip
          tools: composer:v2
          coverage: none
          composer: true
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate --force
      - run: php artisan migrate --force
      - run: php -d memory_limit=2G artisan test --testsuite=Unit,Feature --compact

  browser-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_DB: jawla_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: jawla_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, json, bcmath, pgsql, sockets, gd, intl, zip
          tools: composer:v2
          coverage: none
          composer: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: cp .env.example .env
      - run: php artisan key:generate --force
      - run: php artisan migrate --force
      - run: npm run test:pwa-browser
      - run: php artisan test tests/Browser --compact
