name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jawla_test
          POSTGRES_INITDB_ARGS: "--data-checksums"
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --shm-size=256mb
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo, pdo_pgsql, intl, gd, zip, bcmath
          coverage: none
      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
      - name: Install PHP deps
        run: composer install --no-interaction --prefer-dist --no-progress --no-progress
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install JS deps
        run: npm ci
      - name: Copy env
        run: cp .env.example .env && php artisan key:generate
      - name: Pint (style)
        run: vendor/bin/pint --test
      - name: Build production assets
        run: npm run build
      - name: Enforce PWA asset budgets
        run: npm run audit:pwa-assets
      - name: Pest
        run: vendor/bin/pest --parallel --processes=4
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: jawla_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
      - name: Composer audit
        run: composer audit
      - name: npm audit
        run: npm audit --audit-level=high
      - name: Block obvious committed secrets
        run: |
          ! git grep -nEi '(aws_secret_access_key|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|eta_(client_)?secret\s*[:=]\s*[^$])' -- ':!*.lock' ':!docs/**'
