name: deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full Git commit SHA to promote
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: jawla-production-promotion
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
    steps:
      - id: release
        name: Resolve immutable release
        env:
          RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.release_sha }}
        run: |
          if ! [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_sha must be a full 40-character Git SHA"
            exit 64
          fi
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

  deploy-staging:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      STAGING_SERVICE_ID: ${{ vars.STAGING_SERVICE_ID }}
      STAGING_URL: ${{ vars.STAGING_URL }}
      RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install pinned Railway CLI
        run: npm install --global @railway/cli@5.23.3
      - name: Deploy exact release to staging
        run: >-
          railway up --ci
          --project "$RAILWAY_PROJECT_ID"
          --environment staging
          --service "$STAGING_SERVICE_ID"
          --message "Jawla staging $RELEASE_SHA"
      - name: Verify staging readiness
        run: |
          test -n "$STAGING_URL"
          for i in $(seq 1 30); do
            if curl -fsS "${STAGING_URL%/}/health" | jq -e '.status == "ok" and .db == "ok" and .cache == "ok"'; then
              exit 0
            fi
            sleep 5
          done
          echo "staging readiness check failed"
          exit 1
      - name: Capture deployment evidence
        run: >-
          railway deployment list
          --project "$RAILWAY_PROJECT_ID"
          --environment staging
          --service "$STAGING_SERVICE_ID"
          --limit 5
          --json > staging-deployments.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-deployment-${{ env.RELEASE_SHA }}
          path: staging-deployments.json

  staging-dast:
    needs: [prepare, deploy-staging]
    runs-on: ubuntu-latest
    environment: staging
    env:
      STAGING_URL: ${{ vars.STAGING_URL }}
      RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
    steps:
      - name: OWASP ZAP staging baseline
        run: |
          test -n "$STAGING_URL"
          docker run -v "${GITHUB_WORKSPACE}:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable@sha256:8d387b1a63e3425beef4846e39719f5af2a787753af2d8b6558c6257d7a577a2 zap-baseline.py \
            -t "${STAGING_URL%/}" -I -m 5 \
            -r staging-zap.html -w staging-zap.md
      - name: Upload staging ZAP evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-zap-${{ env.RELEASE_SHA }}
          path: |
            staging-zap.html
            staging-zap.md
          if-no-files-found: error

  deploy-production:
    needs: [prepare, staging-dast]
    runs-on: ubuntu-latest
    # Configure required reviewers on this GitHub environment. Approval is the
    # explicit human promotion gate after staging readiness and DAST succeed.
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      RAILWAY_TOKEN: ${{ secrets.PRODUCTION_RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      PRODUCTION_SERVICE_ID: ${{ vars.PRODUCTION_SERVICE_ID }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install pinned Railway CLI
        run: npm install --global @railway/cli@5.23.3
      - name: Deploy approved release to production
        run: >-
          railway up --ci
          --project "$RAILWAY_PROJECT_ID"
          --environment production
          --service "$PRODUCTION_SERVICE_ID"
          --message "Jawla production $RELEASE_SHA"
      - name: Verify production readiness
        run: |
          test -n "$PRODUCTION_URL"
          for i in $(seq 1 30); do
            if curl -fsS "${PRODUCTION_URL%/}/health" | jq -e '.status == "ok" and .db == "ok" and .cache == "ok"'; then
              exit 0
            fi
            sleep 5
          done
          echo "production readiness check failed; initiate rollback"
          exit 1
      - name: Capture deployment evidence
        run: >-
          railway deployment list
          --project "$RAILWAY_PROJECT_ID"
          --environment production
          --service "$PRODUCTION_SERVICE_ID"
          --limit 5
          --json > production-deployments.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-deployment-${{ env.RELEASE_SHA }}
          path: production-deployments.json
