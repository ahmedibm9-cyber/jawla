[deploy]
preDeployCommand = "php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache"
startCommand = "/app/docker/start-container.sh"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 2

[deploy.env]
APP_ENV = "production"
APP_DEBUG = "false"
APP_URL = "https://jawla-production.up.railway.app"
SESSION_DRIVER = "redis"
SESSION_CONNECTION = "default"
SESSION_STORE = "redis"
SESSION_SECURE_COOKIE = "true"
SESSION_HTTP_ONLY = "true"
CACHE_STORE = "redis"
QUEUE_CONNECTION = "redis"
REDIS_CLIENT = "phpredis"
REDIS_URL = "${{Redis.REDIS_URL}}"
PHP_CLI_SERVER_WORKERS = "4"
FILESYSTEM_DISK = "local"
PHOTO_DISK = "s3"
