[deploy]
preDeployCommand = "php artisan migrate --force && php artisan config:cache && php artisan view:cache"
startCommand = "php artisan serve --host=0.0.0.0 --port=$PORT"
healthcheckPath = "/up"

[deploy.env]
APP_ENV = "production"
APP_DEBUG = "false"
APP_URL = "https://jawla-production.up.railway.app"
SESSION_DRIVER = "database"
SESSION_SECURE_COOKIE = "true"
SESSION_HTTP_ONLY = "true"
CACHE_STORE = "database"
FILESYSTEM_DISK = "local"
